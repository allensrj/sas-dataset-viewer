name: Build & Publish macOS / Win-x64 / Win-AWS Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Desktop x64 exe (GPU glow/wgpu + CPU fallback)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --bin sas-viewer --no-default-features --features "backend-glow,backend-wgpu,backend-cpu"

      - name: Package Windows Desktop executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release\sas-viewer.exe dist\SAS-Dataset-Viewer-win-x64.exe

      - name: Upload Windows Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAS-Dataset-Viewer-win-x64
          path: dist/SAS-Dataset-Viewer-win-x64.exe

  build-win-aws:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows AWS exe (Pure CPU Win32 GDI, zero GPU/DX12/OpenGL)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --bin sas-viewer --no-default-features --features backend-cpu

      - name: Package Windows AWS executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release\sas-viewer.exe dist\SAS-Dataset-Viewer-win-aws.exe

      - name: Upload Windows AWS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAS-Dataset-Viewer-win-aws
          path: dist/SAS-Dataset-Viewer-win-aws.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS .app bundle (Native Apple Metal)
        run: bash scripts/bundle_macos.sh

      - name: Zip macOS .app bundle
        run: |
          cd dist
          ditto -c -k --keepParent "SAS Dataset Viewer.app" SAS-Dataset-Viewer-macOS-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAS-Dataset-Viewer-macOS-arm64
          path: dist/SAS-Dataset-Viewer-macOS-arm64.zip

  publish-release:
    needs: [build-win-x64, build-win-aws, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "SAS Dataset Viewer $TAG_NAME" \
            --notes "Cross-platform high-performance SAS Dataset Viewer (.sas7bdat & .xpt) built with C (ReadStat) + Rust + unified \`winit\` window host (bypassing \`eframe\` to resolve #3).

          ### Downloads (Three Dedicated Builds)
          - **macOS (Apple Silicon)**: \`SAS-Dataset-Viewer-macOS-arm64.zip\` — Native Apple Metal (\`backend-wgpu\`), extract to get \`SAS Dataset Viewer.app\`
          - **Windows Desktop (x64)**: \`SAS-Dataset-Viewer-win-x64.exe\` — Desktop GPU (\`glow\` / \`wgpu\`) with pure-CPU GDI fallback, zero \`Moved\` repaints & coalesced \`Resized\` (#3), static CRT
          - **Windows AWS / Server / RDP (x64)**: \`SAS-Dataset-Viewer-win-aws.exe\` — Pure multi-core CPU Win32 GDI (\`backend-cpu\` only), instant single-process startup, zero GPU/DX12/OpenGL/VC++ dependencies" \
            --latest
