name: Build & Publish Windows & macOS Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows standalone exe
        run: cargo build --release --bin sas-viewer

      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release\sas-viewer.exe dist\SAS-Dataset-Viewer-win64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAS-Dataset-Viewer-Windows
          path: dist/SAS-Dataset-Viewer-win64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS .app bundle
        run: bash scripts/bundle_macos.sh

      - name: Zip macOS .app bundle
        run: |
          cd dist
          zip -r SAS-Dataset-Viewer-macOS-arm64.zip "SAS Dataset Viewer.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAS-Dataset-Viewer-macOS
          path: dist/SAS-Dataset-Viewer-macOS-arm64.zip

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "SAS Dataset Viewer $TAG_NAME" \
            --notes "Cross-platform high-performance SAS Dataset Viewer (.sas7bdat & .xpt) built with C (ReadStat) + Rust + egui.

          ### Downloads
          - **Windows (x64)**: \`SAS-Dataset-Viewer-win64.exe\` (standalone portable executable, double-click to run)
          - **macOS (Apple Silicon)**: \`SAS-Dataset-Viewer-macOS-arm64.zip\` (extract to get \`SAS Dataset Viewer.app\`)" \
            --latest
