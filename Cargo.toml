[workspace]
resolver = "2"
members = [
    "crates/readstat-sys",
    "crates/sas-engine",
    "crates/sas-viewer-app",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
authors = ["allensrj"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
