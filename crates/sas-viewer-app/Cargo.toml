[package]
name = "sas-viewer-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sas-viewer"
path = "src/main.rs"

[features]
default = ["backend-wgpu", "backend-glow", "backend-cpu"]
backend-wgpu = ["dep:egui-wgpu", "dep:wgpu", "dep:pollster"]
backend-glow = ["dep:egui_glow", "dep:glow", "dep:glutin", "dep:glutin-winit", "dep:raw-window-handle"]
backend-cpu = ["dep:softbuffer"]

[dependencies]
sas-engine = { path = "../sas-engine" }
egui = { version = "0.31", default-features = false, features = ["bytemuck", "default_fonts", "log"] }
egui-winit = { version = "0.31", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui_dock = "0.16"
winit = "0.30"
rayon = "1.10"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
chrono = "0.4"
png = "0.18"
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "win-system-proxy"] }

# Optional backend: wgpu (Apple Metal on macOS; DX12/Vulkan/WARP on Windows)
egui-wgpu = { version = "0.31", default-features = false, features = ["winit", "wayland", "x11"], optional = true }
wgpu = { version = "24.0", optional = true }
pollster = { version = "0.4", optional = true }

# Optional backend: glow (OpenGL 2.0+ via glutin)
egui_glow = { version = "0.31", default-features = false, features = ["wayland", "x11"], optional = true }
glow = { version = "0.16", optional = true }
glutin = { version = "0.32", default-features = false, features = ["egl", "wgl", "glx", "x11", "wayland"], optional = true }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wgl", "glx", "x11", "wayland"], optional = true }
raw-window-handle = { version = "0.6", optional = true }

# Optional backend: pure-CPU software rasterizer (Win32 GDI BitBlt / macOS CoreGraphics via softbuffer)
softbuffer = { version = "0.4", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
