[package]
name = "sas-viewer-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sas-viewer"
path = "src/main.rs"

[dependencies]
sas-engine = { path = "../sas-engine" }
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
egui_dock = "0.16"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
chrono = "0.4"
